<!DOCTYPE html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>房间 · GTSCDT</title>
<style>
:root{--bg:#081813;--line:rgba(244,239,226,.13);--text:#F4EFE2;--muted:#9DB3A6;--amber:#D98A2B;--amber-l:#E9B45C;--jade:#2F8F73}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;padding:22px}
a{color:var(--amber-l);text-decoration:none}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;gap:12px;flex-wrap:wrap}
.brand{font-size:12px;letter-spacing:.12em;color:#7E978A}
h1{font-size:22px;margin:4px 0 14px}
.card{background:linear-gradient(180deg,#0C2A21,#081813);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px}
.k{font-size:12px;letter-spacing:.12em;color:var(--muted);margin-bottom:8px}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:8px;border-bottom:1px solid var(--line);text-align:left}
th{color:var(--muted);font-size:12px}
.btn{border:1px solid var(--line);background:rgba(255,255,255,.05);color:var(--text);border-radius:9px;padding:8px 14px;font-size:13px;cursor:pointer}
.btn.primary{background:rgba(217,138,43,.18);border-color:rgba(233,180,92,.55);color:#F6E4C6}
input{background:rgba(255,255,255,.05);border:1px solid var(--line);border-radius:9px;color:var(--text);padding:8px 10px;font-size:14px}
.pill{border:1px solid rgba(233,180,92,.35);color:var(--amber-l);border-radius:999px;padding:1px 8px;font-size:11px}
.muted{color:var(--muted)} .small{font-size:12px}
</style></head><body>
<div class="top"><div class="brand">GTSCDT · 房间管理</div><div><a href="/login">讲师登录</a> · <a href="/screen">大屏</a> · <a href="/shell">课程包</a></div></div>
<h1>课堂房间</h1>
<div class="card"><div class="k">创建房间</div>
  <input id="title" placeholder="班级/课程名，例如：10-23 AI 训练营" style="width:min(420px,100%)" />
  <button class="btn primary" id="create">创建</button>
  <span class="muted small" id="msg"></span>
</div>
<div class="card"><div class="k">房间列表</div><div style="overflow:auto"><table id="tbl"></table></div></div>
<script>
function copy(t){navigator.clipboard&&navigator.clipboard.writeText(t);}
function load(){
  fetch('/api/rooms').then(function(r){return r.json()}).then(function(d){
    var rows=(d.rooms||[]).map(function(x){
      return '<tr><td><b>'+x.code+'</b></td><td>'+x.title+'</td><td>'+x.students+'</td><td class="small">'
        +'<a href="/room?code='+x.code+'">入口页</a> · <a href="/ops?room='+x.code+'">操作台</a> · <a href="/screen?room='+x.code+'" target="_blank">大屏</a> · <a href="/remote?room='+x.code+'" target="_blank">遥控器</a> · <a href="/join?room='+x.code+'" target="_blank">学员</a></td></tr>';
    }).join('');
    document.getElementById('tbl').innerHTML='<tr><th>房间码</th><th>名称</th><th>人数</th><th>入口</th></tr>'+rows;
  });
}
document.getElementById('create').onclick=function(){
  fetch('/api/rooms/create',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({title:document.getElementById('title').value})}).then(function(r){return r.json()}).then(function(d){
    if(d.ok){location.href='/room?code='+d.code}else{document.getElementById('msg').textContent=d.error||'创建失败'}
  });
};
load();
</script></body></html>
