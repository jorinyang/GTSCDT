<!DOCTYPE html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>弈策课程运营系统 · 登录</title>
<link rel="stylesheet" href="/ui.css" />
<style>
html,body{height:100%}
#login{display:flex;height:100vh;overflow:hidden}
.brand-side{flex:1.1;min-width:0;padding:48px 56px;display:flex;flex-direction:column;justify-content:space-between;background:radial-gradient(1100px 560px at 20% 8%,rgba(203,247,78,.08),transparent),radial-gradient(820px 460px at 82% 92%,rgba(51,85,255,.12),transparent)}
.logo{display:flex;align-items:center;gap:11px;font-weight:700;font-size:15px;letter-spacing:.4px}
.logo-dot{width:32px;height:32px;border-radius:10px;background:var(--lime);display:grid;place-items:center;color:#0E0E10;font-weight:800;font-size:15px}
.hero h1{font-size:40px;line-height:1.22;font-weight:800;letter-spacing:-.8px;max-width:500px}
.hero h1 em{color:var(--lime);font-style:normal}
.hero p{color:var(--ink2);margin-top:14px;max-width:430px;font-size:14.5px;line-height:1.8}
.values{display:flex;gap:30px;flex-wrap:wrap;margin-top:30px;color:var(--lime);font-size:21px;font-weight:800;letter-spacing:.04em}
.foot{color:var(--ink3);font-size:11.5px;letter-spacing:.02em}
.side{flex:.9;min-width:0;display:flex;align-items:center;justify-content:center;padding:40px;background:var(--bg2);overflow:auto}
.login-card{width:100%;max-width:380px;background:var(--card);border:1px solid var(--line);border-radius:24px;padding:28px}
.login-card h2{font-size:20px;margin-bottom:6px}
.login-card .sub{color:var(--ink2);font-size:13px;margin-bottom:22px;line-height:1.6}
.big-btn{display:flex;text-decoration:none;align-items:center;justify-content:center;width:100%;height:46px;border-radius:13px;background:var(--lime);color:#0E0E10;font-weight:800;font-size:14.5px;border:none;cursor:pointer;transition:.18s ease}
.big-btn:hover{background:#D9FF6A}
.ding-btn{position:relative;text-decoration:none;display:flex;align-items:center;justify-content:center;gap:10px;height:52px;border-radius:14px;border:1px solid #3D5BFF;background:linear-gradient(100deg,#131A2E 0%,#18243F 52%,#17352C 100%);color:#F7F8FA;font-size:16px;font-weight:700;letter-spacing:.02em;box-shadow:0 0 0 1px rgba(61,91,255,.18),0 12px 30px rgba(0,0,0,.35);overflow:hidden}
.ding-btn:before{content:"";position:absolute;inset:0;background:radial-gradient(120px 80px at 88% 50%,rgba(203,247,78,.22),transparent 70%);pointer-events:none}
.ding-btn:hover{filter:brightness(1.12)}
.ding-btn svg{position:relative;flex:0 0 auto}
.field{margin-bottom:10px}
.field label{display:block;font-size:11.5px;color:var(--ink2);margin-bottom:5px}
.field input{width:100%;height:42px;background:var(--bg);border:1px solid var(--line);border-radius:11px;color:var(--ink);padding:0 12px;font-size:14px}
.field input:focus{border-color:var(--lime);outline:none}
.linkbtn{display:block;width:100%;margin-top:14px;background:none;border:none;color:var(--ink3);font-size:12.5px;cursor:pointer;text-align:center;padding:4px}
.linkbtn:hover{color:var(--ink2)}
.msg{font-size:12px;color:var(--orange);min-height:16px;margin-top:8px;text-align:center}
.hidden{display:none!important}
.divider{display:flex;align-items:center;gap:10px;color:var(--ink3);font-size:11.5px;margin:18px 0 0}
.divider:before,.divider:after{content:"";flex:1;height:1px;background:var(--line)}
@media(max-width:1000px){#login{display:block;height:auto;min-height:100vh}.brand-side{display:none}.side{min-height:100vh;padding:24px}.login-card{max-width:360px}}

.auth-overlay{position:fixed;inset:0;z-index:80;display:flex;align-items:center;justify-content:center;background:rgba(8,9,11,.96);backdrop-filter:blur(4px);padding:24px}
.auth-box{width:100%;max-width:360px;text-align:center}
.auth-logo{width:54px;height:54px;border-radius:16px;background:var(--lime);color:#0E0E10;font-size:23px;font-weight:800;display:grid;place-items:center;margin:0 auto 18px}
.auth-box h2{font-size:20px;margin-bottom:6px}
.spinner{width:28px;height:28px;border-radius:50%;border:3px solid rgba(203,247,78,.2);border-top-color:var(--lime);margin:22px auto;animation:spin .9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.auth-hint{color:var(--ink2);font-size:13px;line-height:1.9;max-width:330px;margin:0 auto}
.auth-back{margin-top:16px}
</style></head><body>
<div id="login">
  <section class="brand-side">
    <div class="logo"><span class="logo-dot">弈</span><span>弈策课程运营系统</span></div>
    <div class="hero">
      <h1>让一堂课<br /><em>从开场跑到复盘</em></h1>
      <p>课程生成、学员互动、讲师遥控、授课大屏、作业评分装进一套系统。钉钉登录，进来就是你的课堂。</p>
      <div class="values"><span>师生共创</span><span>学以致用</span><span>多端协同</span></div>
    </div>
    <div class="foot">YSCOT · Yice Strategy Course Operation Tool</div>
  </section>
  <section class="side">
    <div class="login-card">
      <h2>登录</h2>
      <p class="sub" id="sub">使用钉钉扫码进入课堂</p>

      <div id="paneDing">
        <a class="big-btn ding-btn" id="ding" href="/auth/dingtalk">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg>
          <span>钉钉登录</span>
        </a>
        <div class="divider">或</div>
        <button class="linkbtn" id="showLocal">使用本地口令</button>
      </div>

      <div id="paneLocal" class="hidden">
        <div class="field"><label>讲师口令</label><input id="pwd" type="password" placeholder="输入本地口令" /></div>
        <button class="big-btn" id="local">进入课堂</button>
        <button class="linkbtn" id="backDing">返回钉钉登录</button>
      </div>

      <p class="msg" id="msg"></p>
    </div>
  </section>
</div>
<script>
function showLocal(on){
  document.getElementById('paneLocal').classList.toggle('hidden',!on);
  document.getElementById('paneDing').classList.toggle('hidden',on);
  document.getElementById('sub').textContent=on?'使用本地口令进入课堂':'使用钉钉扫码进入课堂';
}
document.getElementById('showLocal').onclick=function(){showLocal(true)};
if(new URLSearchParams(location.search).get('local')==='1')showLocal(true);
document.getElementById('backDing').onclick=function(){showLocal(false)};
fetch('/api/auth/config').then(function(r){return r.json()}).then(function(d){
  if(!d.dingtalk)showLocal(true);
  if(!d.local){showLocal(false);document.getElementById('showLocal').style.display='none';}
}).catch(function(){});
document.getElementById('local').onclick=function(){
  fetch('/auth/local',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:document.getElementById('pwd').value})}).then(function(r){return r.json()}).then(function(d){
    if(d.ok){location.href='/home'}else{document.getElementById('msg').textContent=d.error||'登录失败'}
  }).catch(function(){document.getElementById('msg').textContent='服务未响应'});
};
</script><div class="auth-overlay hidden" id="authOverlay">
  <div class="auth-box">
    <div class="auth-logo">弈</div>
    <h2>正在前往钉钉授权…</h2>
    <div class="spinner"></div>
    <p class="auth-hint" id="authHint">正在跳转到钉钉授权页，请稍候。</p>
    <button class="big-btn auth-back hidden" id="authBack" style="max-width:220px;margin-left:auto;margin-right:auto">返回登录</button>
  </div>
</div>
</body></html>
