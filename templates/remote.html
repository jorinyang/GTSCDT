<!DOCTYPE html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>遥控器 · 课堂</title><style>
:root{--bg:#081813;--panel:#0E2A21;--line:rgba(244,239,226,.13);--text:#F4EFE2;--muted:#9DB3A6;--amber:#D98A2B;--amber-l:#E9B45C;--jade:#2F8F73;--jade-l:#63B79A}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;min-height:100vh}
a{color:var(--amber-l);text-decoration:none}
.top{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;border-bottom:1px solid var(--line);gap:10px;flex-wrap:wrap}
.brand{font-size:12px;letter-spacing:.12em;color:#7E978A}
.links{display:flex;gap:12px;font-size:13px;flex-wrap:wrap}
.pill{border:1px solid rgba(233,180,92,.35);color:var(--amber-l);border-radius:999px;padding:2px 10px;font-size:12px}
.btn{border:1px solid var(--line);background:rgba(255,255,255,.05);color:var(--text);border-radius:12px;padding:12px 14px;font-size:15px;cursor:pointer}
.btn.primary{background:rgba(217,138,43,.18);border-color:rgba(233,180,92,.55);color:#F6E4C6}
.btn.danger{border-color:rgba(200,80,60,.5);color:#F0A08E}
.btn.wide{width:100%;padding:18px;font-size:18px;margin-bottom:12px}
.card{background:linear-gradient(180deg,#0C2A21,#081813);border:1px solid var(--line);border-radius:16px;padding:16px;margin:14px}
.k{font-size:12px;letter-spacing:.12em;color:var(--muted);margin-bottom:10px}
.muted{color:var(--muted)} .small{font-size:12px}
input,textarea{width:100%;background:rgba(255,255,255,.05);border:1px solid var(--line);border-radius:10px;color:var(--text);padding:10px;font-size:15px;font-family:inherit;margin-bottom:8px}
</style><link rel="stylesheet" href="/ui.css" />
</head><body>
<div class="top"><div class="brand">GTSCDT · 遥控器</div><div class="links"><span class="pill" id="room">ROOM</span><a href="/screen" target="_blank">大屏</a><a href="/ops" target="_blank">后台</a></div></div>
<div class="card"><div class="k">投票</div>
  <select id="presetSel" style="margin-bottom:8px"></select>
  <button class="btn primary wide" id="presetStart">用预置题目发起</button>
  <input id="q" placeholder="问题（例：今天讲清楚了吗？）" />
  <textarea id="opts" rows="3" placeholder="选项，每行一个">清楚
一般
没跟上</textarea>
  <div class="row" style="display:flex;gap:10px"><button class="btn primary wide" id="pollStart">发起投票</button><button class="btn wide" id="pollStop">结束投票</button></div>
  <div class="muted small" id="pollStat">未进行</div>
</div>
<div class="card"><div class="k">抢答</div>
  <button class="btn wide" id="buzzEnable">开启抢答</button>
  <button class="btn primary wide" id="buzzStart">开始抢答（下一轮）</button>
  <button class="btn wide" id="buzzOff">关闭抢答</button>
  <div class="muted small" id="buzzStat">未开启</div>
</div>
<div class="card"><div class="k">工作坊</div>
  <div style="display:flex;gap:8px;align-items:center;margin-bottom:8px"><input id="wsMin" type="number" value="90" min="1" max="240" style="width:90px" /><span class="muted small">分钟</span></div>
  <button class="btn primary wide" id="wsStart">开始计时</button>
  <button class="btn wide" id="wsReset">重置计时</button>
  <button class="btn wide" id="wsPush">推送/撤回行动卡</button>
  <div class="muted small" id="wsStat">未开始</div>
</div>
<div class="card"><div class="k">答题</div>
  <button class="btn primary wide" id="quizStart">开始答题（按题库配置）</button>
  <button class="btn wide" id="quizClose">结束答题</button>
  <div class="muted small" id="quizStat">—</div>
</div>
<div class="card"><div class="k">课堂控制</div>
  <button class="btn wide" id="matToggle">素材发放：—</button>
  <button class="btn wide" id="hwToggle">作业提交：—</button>
  <button class="btn wide" id="buzzReset">抢答重置（开始新一轮）</button>
  <div class="row" style="display:flex;gap:8px;margin-top:8px">
    <button class="btn" data-view="stats">大屏·数据</button>
    <button class="btn" data-view="course">大屏·课件</button>
    <button class="btn" data-view="promo">大屏·宣传页</button>
  </div>
  <div class="row" style="display:flex;gap:8px;margin-top:8px">
    <button class="btn" id="slidePrev">课件上一页</button>
    <button class="btn" id="slideNext">课件下一页</button>
  </div>
</div>
<script>
var q=new URLSearchParams(location.search), ROOM=(q.get('room')||'').toUpperCase();
document.getElementById('room').textContent=ROOM||'ROOM0';
function api(p,b){var u=p+(ROOM?((p.indexOf('?')>=0?'&':'?')+'room='+ROOM):'');return fetch(u,b?{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)}:{cache:'no-store'}).then(function(r){return r.json()})}
function post(p,b){return api(p,b)}
function refresh(){api('/api/screen').then(function(d){
  document.getElementById('pollStat').textContent=d.poll.active?('进行中 · '+d.poll.count+' 票'):'未进行';
  document.getElementById('buzzStat').textContent='第 '+(d.buzz.round||0)+' 轮 · '+(d.buzz.winner?('已抢到：'+d.buzz.winner):(d.buzz.running?'抢答中':(d.buzz.enabled?'已开启':'未开启')));
  document.getElementById('quizStat').textContent=d.quiz?('进行中 · '+d.quiz.answered+' 人已答'):'未发布';
  window.__mat=!!d.materialOpen;
  document.getElementById('matToggle').textContent='素材发放：'+(d.materialOpen?'已开启':'已关闭');
  document.getElementById('matToggle').className='btn wide '+(d.materialOpen?'primary':'');
  window.__wsOpen=!!d.workshopOpen;
  document.getElementById('wsStat').textContent=(d.timer&&d.timer.running?('计时中 · 剩 '+Math.max(0,Math.round(d.timer.left/60000))+' 分钟'):'计时未开始')+(d.workshopOpen?' · 行动卡已推送':' · 行动卡未推送');
}).catch(function(){})}
document.getElementById('pollStart').onclick=function(){var opts=document.getElementById('opts').value.split('\n').map(function(x){return x.trim()}).filter(Boolean);if(opts.length<2){alert('至少两个选项');return}post('/api/admin/poll',{action:'start',question:document.getElementById('q').value||'现场投票',options:opts}).then(refresh)};
document.getElementById('pollStop').onclick=function(){post('/api/admin/poll',{action:'stop'}).then(refresh)};
document.getElementById('buzzEnable').onclick=function(){post('/api/admin/buzz',{action:'enable'}).then(refresh)};
document.getElementById('buzzStart').onclick=function(){post('/api/admin/buzz',{action:'start'}).then(refresh)};
document.getElementById('buzzOff').onclick=function(){post('/api/admin/buzz',{action:'disable'}).then(refresh)};
document.getElementById('quizClose').onclick=function(){post('/api/admin/quiz',{action:'close'}).then(refresh)};
document.getElementById('wsStart').onclick=function(){post('/api/admin/timer',{action:'start',minutes:Number(document.getElementById('wsMin').value)||90}).then(refresh)};
document.getElementById('wsReset').onclick=function(){post('/api/admin/timer',{action:'reset'}).then(refresh)};
document.getElementById('wsPush').onclick=function(){post('/api/admin/workshop',{open:!window.__wsOpen}).then(refresh)};
var _ws=null;
function loadPresets(){
  post('/api/admin/votepreset',{action:'list'}).then(function(d){
    var sel=document.getElementById('presetSel'); var list=(d&&d.list)||[];
    sel.innerHTML='<option value="">（选择预置题目）</option>'+list.map(function(v){return '<option value="'+v.id+'">'+v.question+'</option>'}).join('');
    window.__presets=list;
  }).catch(function(){});
}
document.getElementById('presetStart').onclick=function(){
  var id=document.getElementById('presetSel').value; var v=(window.__presets||[]).filter(function(x){return x.id===id})[0];
  if(!v){alert('先在课堂后台添加预置题目');return}
  post('/api/admin/poll',{action:'start',question:v.question,options:v.options}).then(refresh);
};
document.getElementById('quizStart').onclick=function(){post('/api/admin/quiz',{action:'startPreset'}).then(function(d){ if(d&&d.ok===false)alert(d.error||'题库为空'); refresh(); })};
document.getElementById('matToggle').onclick=function(){post('/api/admin/material',{open:!window.__mat}).then(refresh)};
document.getElementById('hwToggle').onclick=function(){post('/api/admin/hw',{open:!window.__hw}).then(refresh)};
document.getElementById('buzzReset').onclick=function(){post('/api/admin/buzz',{action:'start'}).then(refresh)};
document.querySelectorAll('[data-view]').forEach(function(b){b.onclick=function(){post('/api/admin/screen',{view:b.getAttribute('data-view')}).then(refresh)}});
document.getElementById('slidePrev').onclick=function(){post('/api/admin/slide',{action:'prev'})};
document.getElementById('slideNext').onclick=function(){post('/api/admin/slide',{action:'next'})};
loadPresets();
refresh();setInterval(refresh,2500);
</script></body></html>
