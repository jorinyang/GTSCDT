name: rename-repo-once
on:
  push:
    paths:
      - '.github/workflows/rename-repo.yml'
permissions:
  contents: read
  administration: write
jobs:
  rename:
    if: github.repository == 'jorinyang/GTSCDT'
    runs-on: ubuntu-latest
    steps:
      - name: Rename repository
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -X PATCH "repos/${{ github.repository }}" -f name="Yice-Strategy-Course-Operation-Tool" --jq '.full_name'
