# YSCOT 反向代理（放在 ECS 上，Nginx 终止 HTTPS，Node 跑 8899）
server {
    listen 80;
    server_name yscot.clawshell.online;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name yscot.clawshell.online;

    ssl_certificate     /etc/letsencrypt/live/www.clawshell.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.clawshell.online/privkey.pem;

    client_max_body_size 20m;

    location / {
        proxy_pass http://127.0.0.1:8899;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;          # SSE 必须关缓冲
        proxy_read_timeout 3600s;
    }
}
