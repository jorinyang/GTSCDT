<!DOCTYPE html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>课程内容 · GTSCDT</title>
<link rel="stylesheet" href="/ui.css" />
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:Inter,'PingFang SC','Microsoft YaHei',system-ui,sans-serif;padding:22px}
a{color:var(--lime);text-decoration:none}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;gap:10px;flex-wrap:wrap}
.brand{font-size:12px;letter-spacing:.12em;color:var(--ink3)}
h1{font-size:22px;letter-spacing:-.02em}
.muted{color:var(--ink2)} .small{font-size:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:18px;margin-bottom:14px}
.k{font-size:12px;letter-spacing:.12em;color:var(--ink2);margin-bottom:10px}
input[type=text],input[type=date],select{background:var(--bg2);border:1px solid var(--line);border-radius:11px;color:var(--ink);padding:9px 11px;font-size:14px}
.btn{border:1px solid var(--line);background:var(--card2);color:var(--ink);border-radius:10px;padding:8px 14px;font-size:13px;cursor:pointer}
.btn.primary{background:var(--lime);color:#0E0E10;border-color:var(--lime);font-weight:700}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:8px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:900px){.two{grid-template-columns:1fr}}
.filelist{margin-top:12px;display:flex;flex-direction:column;gap:8px}
.file{display:flex;align-items:center;justify-content:space-between;gap:10px;border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--bg2)}
.file .nm{font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.file .meta{font-size:11px;color:var(--ink3);margin-top:2px}
.hint{font-size:12px;color:var(--ink3);line-height:1.7;margin-top:8px}
#previewWrap{display:none;margin-top:12px}
#previewWrap iframe{width:100%;height:420px;border:1px solid var(--line);border-radius:14px;background:#fff}
.tag{font-size:10.5px;padding:2px 7px;border-radius:99px;border:1px solid var(--line);color:var(--ink3)}
.tag.html{color:var(--lime);border-color:rgba(203,247,78,.4)}
</style></head><body>
<div class="top">
  <div class="brand">GTSCDT · 课程内容</div>
  <div class="small"><a href="/home">← 工作台</a> · <a id="roomLink" href="#">课程房间</a></div>
</div>
<h1 id="title">课程内容</h1>
<p class="muted small" id="sub" style="margin-top:4px">课件与前端页面</p>

<div class="card">
  <div class="k">房间信息</div>
  <div class="row">
    <input id="rt" type="text" style="width:280px" placeholder="房间名称" />
    <select id="rp" style="width:150px"></select>
    <select id="rc" style="width:190px"></select>
    <input id="rd" type="date" style="width:160px" />
    <button class="btn primary" id="rsave">保存</button>
    <span class="small muted" id="rmsg"></span>
  </div>
  <div class="hint">先选省份再选城市；名称还是「日期 + 城市」的默认格式时，选完城市会自动更新，手动改过名称则保留。</div>
</div>

<div class="two">
  <div class="card">
    <div class="k">课件 PPTX</div>
    <p class="hint">上传 pptx 作为课件附件，课堂上可下载或打开。不做内容生成。</p>
    <div class="row"><input id="pptxFile" type="file" accept=".pptx,.ppt" multiple /><span class="small muted" id="pptxMsg"></span></div>
    <div class="filelist" id="pptxList"></div>
  </div>

  <div class="card">
    <div class="k">前端页面 HTML</div>
    <p class="hint">上传 html 直接作为课程页面展示；预览使用沙箱，不会读取本系统登录态。</p>
    <div class="row"><input id="htmlFile" type="file" accept=".html,.htm" multiple /><span class="small muted" id="htmlMsg"></span></div>
    <div class="filelist" id="htmlList"></div>
    <div id="previewWrap"><div class="k" style="margin-top:12px">页面预览</div><iframe id="previewFrame" sandbox="allow-scripts allow-forms" referrerpolicy="no-referrer"></iframe></div>
  </div>
</div>

<div class="card">
  <div class="k">说明</div>
  <div class="hint" style="margin-top:0">
    这个页面只负责把课程内容放进房间：pptx 作为课件，html 作为前端展示页。课程大纲、题库、作业等不再在这里用模型生成。
    学员端、遥控器、大屏会读取房间内容；所有文件按房间保存。
  </div>
</div>

<script>
var q=new URLSearchParams(location.search), CODE=(q.get('code')||q.get('room')||'ROOM0').toUpperCase();
var ROOM=null;
document.getElementById('roomLink').href='/room?code='+CODE;
function esc(s){return String(s==null?'':s).replace(/[&<>]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;'}[c]})}
function fmtSize(n){ return n>(1024*1024)?((n/1024/1024).toFixed(1)+' MB'):(Math.max(1,Math.round(n/1024))+' KB') }
var CITY_DATA=[], AUTO_TITLE=true;
function autoName(d,c){ return String(d||'')+' '+(c||'未设城市'); }
function normCity(x){ return String(x||'').replace(/(市|地区|盟|自治州|布依族苗族自治州|苗族侗族自治州|布依族苗族自治县)$/,''); }
function cityLookup(name){
  if(!name) return null;
  for(var i=0;i<CITY_DATA.length;i++){
    var pv=CITY_DATA[i];
    for(var k=0;k<pv.cities.length;k++){
      var c=pv.cities[k];
      if(c===name || normCity(c)===normCity(name) || c.indexOf(name)===0 || name.indexOf(c)===0) return {province:pv.name,city:c};
    }
  }
  return null;
}
function fillProvinces(selected){
  var rp=document.getElementById('rp');
  rp.innerHTML='<option value="">省份</option>'+CITY_DATA.map(function(p){return '<option value="'+p.name+'">'+p.name+'</option>'}).join('');
  if(selected) rp.value=selected;
}
function fillCities(province, selected){
  var rc=document.getElementById('rc');
  var pv=CITY_DATA.filter(function(p){return p.name===province})[0];
  if(!pv){ rc.innerHTML='<option value="">城市</option>'; return; }
  rc.innerHTML='<option value="">城市</option>'+pv.cities.map(function(c){return '<option value="'+c+'">'+c+'</option>'}).join('');
  if(selected) rc.value=selected;
}
function syncTitle(){
  if(!AUTO_TITLE) return;
  document.getElementById('rt').value=autoName(document.getElementById('rd').value, document.getElementById('rc').value);
}
function loadCityData(){
  return fetch('/assets/china-cities.json',{cache:'no-store'}).then(function(r){return r.json()}).then(function(d){ CITY_DATA=d||[]; }).catch(function(){ CITY_DATA=[]; });
}
function loadRoom(){
  return fetch('/api/rooms',{cache:'no-store'}).then(function(r){return r.json()}).then(function(d){
    ROOM=(d.rooms||[]).filter(function(x){return x.code===CODE})[0]||{};
    document.getElementById('title').textContent='课程内容 · '+CODE;
    document.getElementById('sub').textContent=ROOM.title||'';
    document.getElementById('rt').value=ROOM.title||'';
    document.getElementById('rd').value=ROOM.date||'';
    var origCity=ROOM.city||'';
    var match=cityLookup(origCity);
    var prov=ROOM.province||(match&&match.province)||'';
    if(!prov && !origCity){ prov='浙江省'; }
    fillProvinces(prov);
    var defCity=match?match.city:origCity;
    if(!defCity && prov==='浙江省') defCity='杭州市';
    fillCities(prov, defCity);
    AUTO_TITLE=!ROOM.title || ROOM.title===autoName(ROOM.date, origCity);
    if(AUTO_TITLE) document.getElementById('rt').value=autoName(ROOM.date, document.getElementById('rc').value||origCity);
    renderFiles(ROOM.files||[]);
  }).catch(function(){});
}
document.getElementById('rp').onchange=function(){ fillCities(this.value,''); syncTitle(); };
document.getElementById('rc').onchange=syncTitle;
document.getElementById('rd').onchange=syncTitle;
document.getElementById('rt').oninput=function(){ AUTO_TITLE=(this.value===autoName(document.getElementById('rd').value,document.getElementById('rc').value)); };
document.getElementById('rsave').onclick=function(){
  fetch('/api/rooms/update',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({code:CODE,title:document.getElementById('rt').value,province:document.getElementById('rp').value,city:document.getElementById('rc').value,date:document.getElementById('rd').value})})
    .then(function(r){return r.json()}).then(function(d){
      if(!d.ok){document.getElementById('rmsg').textContent=d.error||'保存失败';return}
      ROOM.title=d.meta.title; ROOM.city=d.meta.city; ROOM.date=d.meta.date; ROOM.province=d.meta.province||'';
      document.getElementById('rt').value=ROOM.title;
      document.getElementById('sub').textContent=ROOM.title;
      AUTO_TITLE=(ROOM.title===autoName(ROOM.date,ROOM.city));
      document.getElementById('rmsg').textContent='已保存';
      setTimeout(function(){document.getElementById('rmsg').textContent=''},1500);
    });
};
function renderFiles(files){
  var ppt=[], html=[];
  files.forEach(function(f){ var ext=(f.name.split('.').pop()||'').toLowerCase(); if(ext==='pptx'||ext==='ppt')ppt.push(f); else if(ext==='html'||ext==='htm')html.push(f); });
  document.getElementById('pptxList').innerHTML=ppt.length?ppt.map(function(f){
    return '<div class="file"><div style="min-width:0"><div class="nm">'+esc(f.name)+'</div><div class="meta">'+fmtSize(f.size||0)+' · PPTX</div></div><div><a class="btn" href="'+f.url+'" target="_blank">打开</a></div></div>';
  }).join(''):'<div class="hint">还没有上传 pptx</div>';
  document.getElementById('htmlList').innerHTML=html.length?html.map(function(f){
    return '<div class="file"><div style="min-width:0"><div class="nm">'+esc(f.name)+'</div><div class="meta">'+fmtSize(f.size||0)+' · HTML</div></div><div><button class="btn" data-preview="'+encodeURIComponent(f.url)+'">预览</button> <a class="btn" href="'+f.url+'" target="_blank">打开</a></div></div>';
  }).join(''):'<div class="hint">还没有上传 html</div>';
  document.querySelectorAll('[data-preview]').forEach(function(b){ b.onclick=function(){ var w=document.getElementById('previewWrap'); w.style.display='block'; document.getElementById('previewFrame').src=decodeURIComponent(b.getAttribute('data-preview')); w.scrollIntoView({behavior:'smooth',block:'center'}); }; });
}
function uploadFiles(inputId,msgId,allowed){
  var inp=document.getElementById(inputId); if(!inp)return;
  inp.onchange=function(){
    var files=[].slice.call(this.files||[]); if(!files.length)return;
    var msg=document.getElementById(msgId); msg.textContent='上传中…';
    Promise.all(files.map(function(f){
      return new Promise(function(resolve){
        var ext=(f.name.split('.').pop()||'').toLowerCase();
        if(allowed.indexOf(ext)<0){ resolve({ok:false,error:'只能上传 '+allowed.join(' / ')}); return; }
        var fr=new FileReader();
        fr.onload=function(){ var b64=String(fr.result).split(',')[1]||'';
          fetch('/api/room/upload?room='+CODE,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({filename:f.name,data:b64})}).then(function(r){return r.json()}).then(resolve).catch(function(e){resolve({ok:false,error:e.message})});
        };
        fr.readAsDataURL(f);
      });
    })).then(function(results){
      var bad=results.filter(function(r){return !r.ok});
      msg.textContent=bad.length?('失败：'+(bad[0].error||'')):'已上传 '+results.length+' 个文件';
      inp.value=''; loadRoom();
    });
  };
}
uploadFiles('pptxFile','pptxMsg',['pptx','ppt']);
uploadFiles('htmlFile','htmlMsg',['html','htm']);
loadCityData().then(loadRoom);
</script></body></html>
